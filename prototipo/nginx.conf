server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # DNS interno de Docker. Con el backend en una variable, nginx lo vuelve a resolver en cada petición (cada 10 s
  # como mucho) y no una sola vez al arrancar: si el backend se reconstruye con otra IP no queda en 502, y si no
  # existe, el prototipo sigue sirviendo sus pantallas y solo /api responde 502 (docs/CONEXION-BACKEND.md, sección 1).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Detrás del túnel de Cloudflare todas las visitas llegan desde el mismo lugar (cloudflared en el servidor, por la
  # red de Docker): sin esto, el límite de login del backend (5 intentos cada 15 min por IP y correo) se repartiría
  # entre todos y una cuenta de demo quedaría bloqueada para todos. Solo se cree la cabecera si viene de la red local
  # o de Docker; sin Cloudflare (en un equipo), no viene y queda la IP de siempre.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  # React Router owns the paths; every unknown URL falls back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached: its asset URLs change on every build.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # La API en el mismo origen, como frontend/: el backend sirve sus rutas en la raíz, así que se quita /api.
  location /api/ {
    set $backend http://backend:3001;
    # Con una variable en proxy_pass nginx ya no recorta el prefijo solo.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # $remote_addr y no $proxy_add_x_forwarded_for: ver frontend/nginx.conf (inventar la cabecera se saltaba el
    # límite de intentos de login).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Flujos SSE (/alerts/stream, /monitoring/:device/waveform, /ai/assist/stream): sin búfer ni caché, para que
    # cada marco llegue al navegador en cuanto sale del backend.
    proxy_buffering off;
    proxy_cache off;
    # La IA tarda hasta LLM_TIMEOUT_SECONDS=180; los flujos de alertas y de ECG mandan un latido cada 25 s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
