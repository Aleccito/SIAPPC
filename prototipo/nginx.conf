server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # React Router owns the paths; every unknown URL falls back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached: its asset URLs change on every build.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
