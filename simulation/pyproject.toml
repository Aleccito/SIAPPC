[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siappc-sim"
version = "1.0.0"
description = "Simulacion de eventos discretos del flujo de pacientes politraumatizados (espejo del modelo FlexSim)"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
siappc = "siappc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
