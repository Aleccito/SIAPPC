# Override solo para correr las pruebas del backend desde el host:
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#   cd backend && npm test
#
# El docker-compose.yml normal no publica el puerto de Redis a propósito: ahí
# solo se alcanza por la red interna de Compose. Esto lo expone, pero atado a
# 127.0.0.1 — no a 0.0.0.0 —, así que sigue sin verse desde la red. MariaDB ya
# publica su puerto en el archivo principal.
services:
  redis:
    ports:
      - '127.0.0.1:6379:6379'
