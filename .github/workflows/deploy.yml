name: Despliegue

# Actualiza el servidor de produccion cuando el CI termina bien en `dev`.
# Entra por SSH con una llave que solo puede ejecutar ~/deploy.sh en el
# servidor (restriccion `command=` en authorized_keys). Ese script trae dev y
# levanta Compose con docker-compose.prod.yml. Las migraciones de base de datos
# NO se corren aqui: siguen siendo manuales.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

# Un despliegue a la vez, sin cancelar el que esta en curso.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    # Solo si el CI paso y fue un push a dev (no un pull request).
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar en el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST"
