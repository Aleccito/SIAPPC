server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # React Router owns the paths; every unknown URL falls back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached: its filename is stable while the hashed
  # asset URLs inside it change on every build. A cached index.html keeps
  # pointing at the previous build's assets.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The API is same-origin from the browser's point of view; the trailing slash
  # on proxy_pass strips the /api prefix, which the backend does not expect.
  location /api/ {
    proxy_pass http://backend:3001/;
    proxy_set_header Host $host;
    # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends the real
    # peer to whatever the client already sent, so a request carrying
    # `X-Forwarded-For: 9.9.9.9` arrives at the backend as `9.9.9.9, <real ip>`.
    # Fastify's req.ip then reads the left-most entry — the one the client made
    # up — and the login rate limit (5 attempts / 15 min, keyed on IP + email)
    # is bypassed by rotating that header. Measured before the fix: 12 failed
    # logins in a row, all 401, never a 429.
    #
    # There is no proxy in front of this nginx, so the real peer is $remote_addr
    # and the header is written, not extended. If one is ever added, this must
    # become `$proxy_add_x_forwarded_for` again AND that proxy has to be the
    # only thing allowed to reach this port.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
