server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With the backend in a variable (see /api/ below),
  # nginx resolves the name on every request (at most every 10 s) instead of
  # once at startup: when the backend is rebuilt and comes back with another
  # IP, /api keeps working instead of answering 502 until this container is
  # restarted. Same as prototipo/nginx.conf.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Behind the Cloudflare tunnel every visit reaches nginx from the same place
  # (cloudflared, on the server or on the Docker network), so without this the
  # login rate limit (5 attempts / 15 min, keyed on IP + email) would be shared
  # by every visitor and one demo account could lock everyone out. The header
  # is trusted ONLY from loopback and the private ranges Docker uses; from
  # anywhere else it is ignored and $remote_addr stays the real peer. Without
  # Cloudflare (on a laptop) the header is simply absent. Same as
  # prototipo/nginx.conf.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  # React Router owns the paths; every unknown URL falls back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached: its filename is stable while the hashed
  # asset URLs inside it change on every build. A cached index.html keeps
  # pointing at the previous build's assets.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # The API is same-origin from the browser's point of view. The backend does
  # not expect the /api prefix: with a variable in proxy_pass nginx no longer
  # strips it on its own (the old `proxy_pass http://backend:3001/;` did), so
  # the rewrite does it.
  location /api/ {
    set $backend http://backend:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter appends the real
    # peer to whatever the client already sent, so a request carrying
    # `X-Forwarded-For: 9.9.9.9` arrives at the backend as `9.9.9.9, <real ip>`.
    # Fastify's req.ip then reads the left-most entry — the one the client made
    # up — and the login rate limit (5 attempts / 15 min, keyed on IP + email)
    # is bypassed by rotating that header. Measured before the fix: 12 failed
    # logins in a row, all 401, never a 429.
    #
    # Cloudflare is now in front of this nginx. That does not change the rule:
    # real_ip (above) already turns $remote_addr into the visitor's IP taken
    # from CF-Connecting-IP, and only when the request comes from a trusted
    # range, so the header is still written, not extended. Whatever can reach
    # this port directly must stay outside those ranges (or the port published
    # only on 127.0.0.1), or it could choose its own IP with that header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
