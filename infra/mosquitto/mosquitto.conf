# Broker MQTT de SIAPPC.
#
# Solo hay listener TLS: no existe puerto 1883 en texto plano, ni siquiera
# dentro de la red de Compose. Un cliente mal configurado no se degrada a
# claro, falla la conexión.

listener 8883
protocol mqtt

# Cadena del servidor. Los tres archivos los genera
# `infra/mosquitto/gen-certs.sh` y viven en `certs/`, que está en .gitignore:
# son certificados de desarrollo, autofirmados y regenerables.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Sin `tls_version` a propósito: fijarlo en mosquitto no marca un mínimo sino
# la única versión aceptada, y dejaría fuera TLS 1.3. OpenSSL ya negocia la
# mejor versión común y rechaza por su cuenta lo anterior a TLS 1.2.

# El cliente valida al broker, no al revés. Poner esto en `true` exige
# certificado de cliente (mTLS): `gen-certs.sh` ya emite `client.crt` y
# `client.key`, y tanto el backend como la Pi saben mandarlos, pero mientras
# la autenticación sea por usuario/contraseña no hace falta.
require_certificate false

# El broker no acepta conexiones anónimas. El archivo de contraseñas lo escribe
# el propio contenedor al arrancar, a partir de MQTT_USER/MQTT_PASSWORD del
# `.env` de la raíz — ver el `command` del servicio en docker-compose.yml. Así
# el broker, el backend y la Pi leen las credenciales de un solo sitio.
allow_anonymous false
password_file /mosquitto/config/passwd

# Mensajes QoS 1 en vuelo y suscripciones de sesiones con clean_session=False
# (la Pi publica así) sobreviven a un reinicio del broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
