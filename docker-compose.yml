services:
  mariadb:
    image: mariadb:11.4
    container_name: siappc-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
      # Only runs on first boot, when the data volume is empty. To re-apply the
      # schema afterwards use `npm run migrate`.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Roles, hospital y el primer admin. Sin esto no hay con qué iniciar
      # sesión: crear usuarios exige un admin ya autenticado.
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: siappc-backend
    restart: unless-stopped
    environment:
      # Inside the compose network MariaDB always listens on 3306; DB_PORT only
      # controls the port published to the host.
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      # Broker donde publica la Pi. Vive fuera de Compose, así que el host debe
      # ser alcanzable desde el contenedor: una IP de la red, no `localhost`.
      # Sin broker el backend sigue sirviendo HTTP y reintenta en segundo plano.
      MQTT_HOST: ${MQTT_HOST:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: siappc-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  mariadb_data:
