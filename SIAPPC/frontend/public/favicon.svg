<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Versión de placa azul de src/shared/BrandLogo.tsx (variant="onBlue").
       En la pestaña se usa esta y no la blanca: la barra del navegador puede ser
       clara u oscura, y una placa blanca desaparece sobre la clara.

       El azul está repetido a mano porque el navegador pide el favicon como
       archivo suelto y no puede importar `brandBlue` de shared/theme.ts. Si
       cambia el azul de la marca, hay que cambiarlo también aquí. -->
