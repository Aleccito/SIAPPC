           V19 A3 3 0 0 1 7 16 H13 A3 3 0 0 0 16 13 V7 A3 3 0 0 1 19 4 Z"/>
  <polyline points="9,24 18,24 20.5,17 23,31 25.5,19.5 27.5,24 39,24"
